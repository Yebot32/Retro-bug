SPDX-FileCopyrightText = "© 2022 merryhime <https://mary.rs>"

[[package]]
path = "external/dynarmic/externals/xbyak/*"
SPDX-License-Identifier = "BSD-3-Clause"
SPDX-FileCopyrightText = "© 2007-2021 herumi"

[[package]]
path = "external/dynarmic/externals/biscuit/*"
SPDX-License-Identifier = "MIT"
SPDX-FileCopyrightText = "© 2021 Lioncash/Lioncache"

[[package]]
path = "external/dynarmic/externals/mcl/*"
SPDX-License-Identifier = "MIT"
SPDX-FileCopyrightText = "© 2022 merryhime"

[[package]]
