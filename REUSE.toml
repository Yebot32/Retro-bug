# REUSE.toml — SPDX license manifest for RetroBug
# Compliant with the REUSE Specification 3.2 (https://reuse.software).
# RetroBug's own code is Apache-2.0; everything under external/ is permissive and recorded
# at path granularity below rather than copying each upstream licence text, which stays
# in-place alongside the source it covers.

version = 1

[[package]]
path = "/*"
SPDX-License-Identifier = "Apache-2.0"
SPDX-FileCopyrightText = "2026 RetroBug contributors"

[[package]]
path = "external/dynarmic/*"
SPDX-License-Identifier = "0BSD"
SPDX-FileCopyrightText = "© 2017 merryhime <git@mary.rs> and dynarmic contributors"

