#
# The Darwin proof for the iOS port (S0): the engine's platform seam compiles and behaves on macOS, the
# same core compiles for iOS arm64, and `core/` keeps its layering rule. None of this needs a device or an
# Apple developer account — static libraries are not signed.
#
# Why a macOS runner and not the Windows development host: the platform layer has a Darwin implementation
# (platform/darwin) that no Windows machine can compile, and the point of S0 is exactly that it compiles.
name: host-and-ios

on:
  push:
    branches: [main, 'session/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.txt'
  workflow_dispatch:

jobs:
  darwin-host:
    name: macOS host — platform seam + layering
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (host build)
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DRB_BUILD_TESTS=ON

      - name: Build and run the platform seam test
        run: |
          set -euo pipefail
          cmake --build build/host --target rb_platform_tests rb_zip_tests rb_apk_assets_tests rb_table_java_tests rb_host_boot_tests -j 4
          ./build/host/core/tests/rb_platform_tests
          ./build/host/core/tests/rb_zip_tests
          ./build/host/core/tests/rb_apk_assets_tests
          ./build/host/core/tests/rb_table_java_tests
          # The boot lane needs the tablet's libc and the gate's fixtures, which a CI runner does not have:
          # it reports "skipped" and exits 0. Building it here is the point — the shared boot compiles for
          # Darwin and links the same core the Android app does.
          ./build/host/core/tests/rb_host_boot_tests

      - name: Layering gate
        run: bash tools/check_layering.sh

  ios-compile:
    name: iOS — the same core compiles for arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure for iOS (no tests, no signing)
        run: >
          cmake -S . -B build/ios
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_BUILD_TYPE=Release
          -DRB_BUILD_TESTS=OFF

      # The platform layer plus the two components that now go through it, then `rb_host` — which pulls the
      # rest of the engine (Tier I, the bridge, the guest process, the inbound trampolines) into an iOS arm64
      # build. No executable guest memory is involved in compiling it; running Tier I writes guest code as
      # data, as iOS requires.
      - name: Build for iOS
        run: cmake --build build/ios --target rb_platform rb_mem rb_loader rb_syscall rb_gfx rb_java rb_host rb_ios -j 4

  ios-ipa:
    name: iOS — unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      # Configures and builds the engine archive, generates the Xcode project and packages Payload/*.app.
      # Signing is off: the artifact is for AltStore/SideStore/a personal team to sign.
      - name: Build the unsigned IPA
        run: bash tools/build_ios_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RetroBug-unsigned-ipa
          path: build/ios/ipa/RetroBug-unsigned.ipa
          if-no-files-found: error
