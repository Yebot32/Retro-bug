# RetroBug — RetroBug contributors. SPDX-License-Identifier: Apache-2.0
#
# CI for the shared engine and the iOS port. Two lanes:
#
#   * linux-host (every push): the host-only suites — the platform seam, the zip reader, the Java profiles,
#     the APK asset view — plus the layering gate. Standard Linux runners bill at 1x, so this is the cheap
#     always-on check.
#   * macOS / iOS / IPA (manual only): Darwin compile proof and the unsigned IPA need macOS runners, which
#     bill at 10x. They are `workflow_dispatch` so an ordinary push cannot burn the monthly minute
#     allowance; run them from the Actions tab (or `gh workflow run host-and-ios.yml`) when an IPA is wanted.
#
# A private repository consumes its monthly minutes; public repositories are free on standard runners.
name: host-and-ios

on:
  push:
    branches: [main, 'session/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-host:
    name: Linux host — seam, zip, Java, assets, audio, layering
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (host build)
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DRB_BUILD_TESTS=ON

      - name: Build and run the host lanes
        run: |
          set -euo pipefail
          cmake --build build/host --target rb_platform_tests rb_zip_tests rb_apk_assets_tests rb_table_java_tests rb_silent_sles_tests rb_dlgl_bootstrap_tests rb_guest_memory_tests rb_thunk_tests rb_interp_neon_tests rb_interp_bench rb_aotgen_tests -j 4
          ./build/host/core/tests/rb_platform_tests
          ./build/host/core/tests/rb_zip_tests
          ./build/host/core/tests/rb_apk_assets_tests
          ./build/host/core/tests/rb_table_java_tests
          ./build/host/core/tests/rb_silent_sles_tests
          ./build/host/core/tests/rb_dlgl_bootstrap_tests
          ./build/host/core/tests/rb_guest_memory_tests
          ./build/host/core/tests/rb_thunk_tests
          ./build/host/core/tests/rb_interp_neon_tests
          # The code-map reader: the corpus half skips on a runner that has no game bytes, but the
          # synthetic refusals and the trace merge still run, so a regression fails the lane.
          ./build/host/tools/aotgen/rb_aotgen_tests
          # Informational: prints the Tier I rate and always exits 0 on a correct result.
          ./build/host/core/tests/rb_interp_bench

      - name: Layering gate
        run: bash tools/check_layering.sh

  darwin-host:
    name: macOS host — platform seam + boot compile + layering
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (host build)
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Release -DRB_BUILD_TESTS=ON

      - name: Build and run the platform seam test
        run: |
          set -euo pipefail
          cmake --build build/host --target rb_platform_tests rb_zip_tests rb_apk_assets_tests rb_table_java_tests rb_silent_sles_tests rb_dlgl_bootstrap_tests rb_host_boot_tests rb_guest_memory_tests rb_thunk_tests rb_interp_neon_tests rb_interp_bench rb_aotgen_tests -j 4
          ./build/host/core/tests/rb_platform_tests
          ./build/host/core/tests/rb_zip_tests
          ./build/host/core/tests/rb_apk_assets_tests
          ./build/host/core/tests/rb_table_java_tests
          ./build/host/core/tests/rb_silent_sles_tests
          ./build/host/core/tests/rb_dlgl_bootstrap_tests
          ./build/host/core/tests/rb_guest_memory_tests
          ./build/host/core/tests/rb_thunk_tests
          ./build/host/core/tests/rb_interp_neon_tests
          # The code-map reader: the corpus half skips on a runner that has no game bytes, but the
          # synthetic refusals and the trace merge still run, so a regression fails the lane.
          ./build/host/tools/aotgen/rb_aotgen_tests
          # Informational: prints the Tier I rate and always exits 0 on a correct result.
          ./build/host/core/tests/rb_interp_bench
          # The boot lane needs the tablet's libc and the gate's fixtures, which a CI runner does not have:
          # it reports "skipped" and exits 0. Building it here is the point — the shared boot compiles for
          # Darwin and links the same core the Android app does.
          ./build/host/core/tests/rb_host_boot_tests

      - name: Layering gate
        run: bash tools/check_layering.sh

  ios-compile:
    name: iOS — the same core compiles for arm64
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure for iOS (no tests, no signing)
        run: >
          cmake -S . -B build/ios
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_BUILD_TYPE=Release
          -DRB_BUILD_TESTS=OFF

      - name: Build for iOS
        run: cmake --build build/ios --target rb_platform rb_mem rb_loader rb_syscall rb_gfx rb_java rb_host rb_ios -j 4

  ios-ipa:
    name: iOS — unsigned IPA
    if: github.event_name == 'workflow_dispatch'
    # XcodeGen writes the current project format; macos-15's Xcode 16 reads it (macos-14's 15.4 does not).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install XcodeGen
        run: brew install xcodegen

      # Configures and builds the engine archive, generates the Xcode project and packages Payload/*.app.
      # Signing is off: the artifact is for AltStore/SideStore/a personal team to sign.
      - name: Build the unsigned IPA
        run: bash tools/build_ios_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RetroBug-unsigned-ipa
          path: build/ios/ipa/RetroBug-unsigned.ipa
          if-no-files-found: error
