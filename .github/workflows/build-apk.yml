# RetroBug — build the launcher APK on GitHub's runners. SPDX-License-Identifier: Apache-2.0
#
# Why this exists: the APK has only ever been built on the maintainer's Windows machine, which means the
# artifact and the recipe live in one place and a phone can only get the file over a cable. This workflow
# builds the same artifact from a clean checkout and attaches it, so "install this and see" does not need
# the desktop at all.
#
# It runs `tools/build_launcher_apk.sh` **unchanged** -- the script that produced the APK verified on
# hardware (`docs/30` §Step 37, 24 PASS / 0 FAIL on the SM7250). The runners are Windows for that reason:
# the three build scripts it chains (`build-guest-apk.sh`, `build-guest-libs.sh`, itself) name the NDK's
# `prebuilt/windows-x86_64` host tag and its `.exe` tools explicitly, so a Linux job would need those
# scripts rewritten and would then be a *second* build path that nothing has run on a phone. A second path
# is how an artifact and its recipe drift apart.
#
# What this workflow is not: it does not run the test lanes. Those need a device (`tools/run_engine_tests.sh`
# pushes to `/data/local/tmp` and refuses to guess between two phones), and a green build here says only
# that the APK was produced -- not that the engine inside it is correct. `docs/30` §Step 37 has the run that
# does say that, and which device said it.
name: build-apk

on:
  # Manual: Actions -> build-apk -> Run workflow.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to a release with this tag (e.g. v0.1.0-test). Leave empty for an artifact only."
        required: false
        default: ""
  push:
    # Every push to main that could change the artifact produces a fresh APK, so "the latest build" is a
    # thing you can download without anyone clicking. The paths list is what keeps that from running the
    # Windows job for a docs edit: it names every input the APK is actually made of.
    #
    # `compat/**`, `cmake/**` and `tests/guest/**` were missing from the list while `CMakeLists.txt`
    # itself was on it, which is the shape that produces a stale artifact rather than a red build: the
    # compat headers are on the include path ahead of everything, the cmake module answers dynarmic's
    # `find_package(Boost)`, and `tools/build-guest-apk.sh` compiles the guest asset out of
    # `tests/guest`. A push touching only those files changed the APK and triggered no build.
    branches: [main]
    paths:
      - "android/**"
      - "core/**"
      - "compat/**"
      - "cmake/**"
      - "tests/guest/**"
      - "tools/build_launcher_apk.sh"
      - "tools/build-guest-apk.sh"
      - "tools/build-guest-libs.sh"
      - "CMakeLists.txt"
      - "external/dynarmic/**"
      - ".github/workflows/build-apk.yml"
    # Tags always build, and publish: a release asset is what makes this installable from a phone's
    # browser with no cable and no desktop.
    tags:
      - "v*"

permissions:
  contents: write # only needed by the release step at the end

jobs:
  launcher-apk:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # The build scripts need javac/jar/keytool for `classes.dex` and for the throwaway signing key.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The action's default package list is `tools platform-tools`, and the legacy `tools` package no
          # longer exists in Google's SDK repository -- so the action fails with "Failed to find package
          # 'tools'" before any step of this workflow runs. That is exactly how run 35890924524 died, 40
          # seconds in. Everything the build needs is named explicitly in the next step.
          packages: platform-tools

      # The same four components the local build uses, pinned to the same versions: the NDK the scripts
      # default to, the cmake the scripts look for by path, the build-tools they look for by version, and
      # the platform whose android.jar they compile Java against.
      #
      # `sdkmanager` is located by path rather than by name. The action puts it on PATH for later steps,
      # and under `shell: bash` that does not resolve -- run 35892061439 died at `sdkmanager: command not
      # found` (exit 127) on the first line that used it. Its install directory is also version-named
      # (`cmdline-tools/16.0/bin` on this runner), which is why the glob rather than a literal `latest`.
      - name: Install SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$(cygpath -u "$ANDROID_HOME")"
          SDKMGR="$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager.bat 2>/dev/null | tail -1)"
          [ -n "$SDKMGR" ] || { echo "no sdkmanager.bat under $SDK_ROOT/cmdline-tools"; ls -la "$SDK_ROOT"; exit 1; }
          echo "using $SDKMGR"
          # Licenses were already accepted by the action above; `--install` would prompt otherwise.
          "$SDKMGR" --install \
            "ndk;28.2.13676358" \
            "cmake;3.31.6" \
            "build-tools;36.1.0" \
            "platforms;android-36"
          "$SDKMGR" --list_installed

      # The two guest images the APK carries as assets. They are built, never downloaded: the guest APK is
      # the same file the C++ lane pushes to /data/local/tmp, and libm.so is linked out of the NDK's own
      # arm32 archives (docs/34 §1).
      # The signing key, from repository secrets rather than generated per run.
      #
      # Why: an install of a newer build over an older one is refused when the two are signed by different
      # keys (`INSTALL_FAILED_UPDATE_INCOMPATIBLE`), so a workflow that generated a key each run would
      # produce APKs that can only be installed after uninstalling the previous one -- which deletes the
      # app's data. That is exactly what happened on the first successful CI artifact: it built, uploaded,
      # downloaded, and then refused to install over the local build with one line of adb output.
      #
      # The key is a *test* key: it signs a probe app whose whole job is to run the engine and print numbers.
      # It is not a release key and nothing here would be published under it. The absence of the secret is
      # loud rather than fatal -- the build still runs and still uploads, with a warning that this artifact
      # will not install over the last one.
      - name: Materialize the signing key
        shell: bash
        env:
          B64: ${{ secrets.RB_KEYSTORE_B64 }}
          PASS: ${{ secrets.RB_KEYSTORE_PASS }}
          ALIAS: ${{ secrets.RB_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "${B64:-}" ]; then
            echo "::warning::no RB_KEYSTORE_B64 secret: this APK is signed with a throwaway key and will not install over a previous build"
            exit 0
          fi
          KS="$RUNNER_TEMP/rb-test.keystore"
          printf '%s' "$B64" | base64 -d > "$KS"
          { echo "RB_KEYSTORE=$KS"; echo "RB_KEYSTORE_PASS=$PASS"; echo "RB_KEY_ALIAS=$ALIAS"; } >> "$GITHUB_ENV"

      - name: Build the guest libraries (libm, libz)
        shell: bash
        # `build_launcher_apk.sh` treats BOTH as required (`GUEST_LIBM`/`GUEST_LIBZ` in its requirement
        # list) and exits 1 on either missing — and this step built `libm` alone, so the runs of Steps 42
        # and 46 (checked with `gh run view`; the red X alone does not say which step) died one step later
        # with "missing build/guest-libs/libz.so". Other runs in that stretch died earlier, inside this
        # script's own gates — which is why the count of red runs was never attributed here precisely.
        # Nothing noticed because no test builds or runs the launcher.
        run: bash tools/build-guest-libs.sh libm libz

      - name: Build the guest probe APK
        shell: bash
        run: bash tools/build-guest-apk.sh

      - name: Build launcher APK
        shell: bash
        run: bash tools/build_launcher_apk.sh

      # The script prints a table of what it packaged; the same list goes in the run's log so a build can
      # be judged without downloading anything.
      - name: Show what was packaged
        shell: bash
        run: |
          set -euo pipefail
          ls -la build/launcher-apk/
          echo "--- sha256 ---"
          sha256sum build/launcher-apk/rbguest-launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rbguest-launcher-apk
          path: build/launcher-apk/rbguest-launcher.apk
          if-no-files-found: error

      # A tag, or a manual run that named one, publishes the APK as a release asset so it can be downloaded
      # straight from a phone. Assets are what make this installable without a cable.
      - name: Publish the APK as a release asset
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
          body: |
            RetroBug launcher APK, built from ${{ github.sha }} by the `build-apk` workflow.

            The launcher is the app a 32-bit game runs inside: its library lists 32-bit games on the device,
            converts one into a playable copy, and runs it. Built as a debuggable dev build unless the
            workflow is asked for a release.
          files: build/launcher-apk/rbguest-launcher.apk
          fail_on_unmatched_files: true
